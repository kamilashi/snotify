[package]
name = "snotify"
version = "0.1.0"
edition = "2021"
default-run = "snotify"

[dependencies]
rand = "0.8.5"
axum = "0.8"
rspotify = { version = "0.16.1", features = ["client-reqwest", "env-file", "cli"] }
rspotify-http = "0.16.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = "0.12"
log = "0.4"
env_logger = { version = "0.11.0", default-features = false, features = ["auto-color"] }
serde = { version = "1.0.130", default-features = false }
serde_json = "1.0.67"
